name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # only used for releases from v* tags

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the bridge (Windows' built-in C# compiler)
        shell: cmd
        run: |
          call build.cmd main || exit /b 1
          call build.cmd bg || exit /b 1

      - name: Self-test
        shell: cmd
        run: |
          call build.cmd selftest || exit /b 1
          AuraChromaBridge-selftest.exe

      - name: Version
        id: version
        shell: pwsh
        run: |
          $m = Select-String -Path src/Program.cs -Pattern 'Version = "([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") {
            throw "Tag $env:GITHUB_REF_NAME doesn't match Program.Version $v"
          }

      - name: Upload the exes
        uses: actions/upload-artifact@v4
        with:
          name: AuraChromaBridge-${{ steps.version.outputs.version }}-exe
          path: |
            AuraChromaBridge.exe
            AuraChromaBridge-bg.exe

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\AuraChromaBridge.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with $LASTEXITCODE" }
          Get-Item dist\AuraChromaBridge-Setup-x64.exe

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: AuraChromaBridge-${{ steps.version.outputs.version }}-Setup-x64
          path: dist/AuraChromaBridge-Setup-x64.exe

      - name: Release (v* tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A release made on GitHub's site already exists: attach the installer to it.
          # Otherwise (tag pushed with git) create a draft to review and publish.
          gh release view "${{ github.ref_name }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload "${{ github.ref_name }}" dist\AuraChromaBridge-Setup-x64.exe --clobber
          } else {
            gh release create "${{ github.ref_name }}" dist\AuraChromaBridge-Setup-x64.exe `
              --draft --title "AuraChromaBridge ${{ steps.version.outputs.version }}" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "gh release failed with $LASTEXITCODE" }
