; AuraChromaBridge settings. Anything after ; is a comment.
; While the sync is running, save this file and the change shows up within a second.

; static    = one colour everywhere
; breathing = the colour fades in and out
; spectrum  = everything cycles through the rainbow together
; wave      = a rainbow runs along the case fans/strip; Razer gear follows the start of it
effect = spectrum

; Colour for static and breathing: #RRGGBB or a name (red, orange, yellow, green, cyan, blue, purple, pink, white).
color = #00A0FF

; Seconds per cycle for breathing, spectrum and wave (0.5 to 600).
speed = 37.8

; Seconds to shift the cycle so it lines up with Razer Synapse (used with effect = spectrum).
phase = -17.8

; 1-100, for everything.
brightness = 100

; 1-100, extra dimming for the ASUS fans and strip only (ARGB fans are often brighter than Razer gear).
asus_brightness = 100

; Updates per second (1-60).
maxfps = 30

; How colours are sent to Razer devices:
;   auto   = headset and Chroma Link get the per-LED command (needed for the Kraken V4), the rest the plain one
;   static = plain one-colour command for everything
;   custom = per-LED command for everything
razer_style = auto

; Razer device kinds to leave alone, so they keep their own Synapse lighting (comma separated:
; keyboard, mouse, headset, mousepad, keypad, chromalink), or 'all' to leave every Razer device to
; Synapse and drive only the ASUS side (and DSX). 'all' is the mode to use with a Kraken V4, which
; ignores lighting apps: Synapse runs Spectrum Cycling and the bridge matches it with speed/phase.
razer_skip = all

; ASUS devices to drive. AddressableStrip 3 = the AIO; the fans and strip are on strip 1 or 2. Mainboard = the board's own LEDs.
only = Mainboard, AddressableStrip

; ASUS devices to never drive (comma separated).
skip =

; PS5 controller light bar through the DSX app (DSX: enable its UDP listener, port 6969).
dsx = on
dsx_port = 6969
